[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-build-cost-toolkit"
version = "1.0.0"
description = "Measure GitHub Copilot CLI consumption and publish an auditable AI build-cost report."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Kyle Thompson" }]
keywords = ["github-copilot", "ai-cost", "telemetry", "prompt-caching", "developer-productivity"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.scripts]
aic = "ai_build_cost.cli:main"

[project.urls]
Homepage = "https://github.com/walkthenose75/ai-build-cost-toolkit"
Repository = "https://github.com/walkthenose75/ai-build-cost-toolkit"
Issues = "https://github.com/walkthenose75/ai-build-cost-toolkit/issues"

[tool.setuptools.packages.find]
include = ["ai_build_cost*"]

[tool.setuptools.package-data]
ai_build_cost = ["pricing.json", "skill/SKILL.md"]
